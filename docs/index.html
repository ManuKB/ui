<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="Personal Savings & Asset Tracker — dashboard for the ESP32 firmware API" />
    <title>Savings Tracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 20l4-6 4 3 6-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="https://manukb.github.io/ui/assets/index-DEeXy_Sq.js"></script>
    <link rel="stylesheet" crossorigin href="https://manukb.github.io/ui/assets/index-BrnU759h.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('savings-tracker:settings:v1') || '{}');
        var pref = s.theme || 'system';
        var resolved =
          pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref;
        document.documentElement.dataset.theme = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </body>
</html>
